name: Sync upstream and deploy

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ternssh-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout automation repo
        uses: actions/checkout@v4
        with:
          path: self

      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: haradakashiwa/ternssh
          ref: main
          path: upstream
          fetch-depth: 0

      - name: Resolve upstream commit
        id: rev
        working-directory: upstream
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore deployed marker
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .deployed-sha
          key: ternssh-deployed-${{ steps.rev.outputs.sha }}

      - name: Setup Node
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            upstream/package-lock.json
            upstream/web/package-lock.json
            upstream/server/package-lock.json

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: upstream
        run: npm ci

      - name: Build web assets
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: upstream
        run: npm run build

      - name: Migrate D1 and deploy Worker
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: upstream
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 00c5e26f7ea053e35c2d9a22b67e9f91
          D1_DATABASE_ID: 97ad2de4-7de2-46bd-9ee0-3bab18186a1e
          CI: "true"
        run: |
          node scripts/generate-production-config.mjs --require
          npx wrangler d1 migrations apply ternssh --remote --config wrangler.production.jsonc
          npx wrangler deploy --config wrangler.production.jsonc
          echo "${{ steps.rev.outputs.sha }}" > "$GITHUB_WORKSPACE/.deployed-sha"

      - name: Save deployed marker
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .deployed-sha
          key: ternssh-deployed-${{ steps.rev.outputs.sha }}

      - name: Mirror upstream into this repository
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        working-directory: upstream
        run: |
          mkdir -p .github/workflows
          find .github/workflows -maxdepth 1 -type f ! -name "sync-upstream.yml" -delete
          cp "$GITHUB_WORKSPACE/self/.github/workflows/sync-upstream.yml" .github/workflows/sync-upstream.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync upstream ${{ steps.rev.outputs.sha }}"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:main
